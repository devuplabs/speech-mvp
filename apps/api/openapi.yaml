openapi: 3.1.0
info:
  title: Sona API
  version: 0.1.0
  description: Intake, clinician workflows, and A2UI agent surface (uk/dev).
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: OK
  /ready:
    get:
      summary: Readiness (includes inference when configured)
      responses:
        "200":
          description: OK
  /v1/meta:
    get:
      summary: Service metadata
      responses:
        "200":
          description: OK
  # --- Practice onboarding (Feature 3). Bearer = Firebase ID token. ---
  /v1/practices:
    post:
      summary: Create practice + admin seat (admin sign-up, screen 01)
      description: >-
        Authenticated by a Firebase ID token; provisions the practice and the
        admin's seat from the verified identity. Idempotent per Firebase user.
      security:
        - firebaseToken: []
      responses:
        "201":
          description: Practice created
        "200":
          description: Practice already exists for this user
        "401":
          description: Missing/invalid token
        "503":
          description: Firebase Admin not configured (pending Auth·01)
  /v1/practices/{id}/plan:
    patch:
      summary: Set plan mode + seats (screen 02)
      security:
        - firebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Plan updated
        "403":
          description: Not an admin of this practice
        "409":
          description: Seat count below seats already in use
  /v1/practices/{id}:
    patch:
      summary: Update practice name / location / specialties (screen 03)
      security:
        - firebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Practice updated
        "403":
          description: Not an admin of this practice
  /v1/practices/{id}/clinicians:
    get:
      summary: List clinician seats (screen 04)
      security:
        - firebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Clinician roster + seats used
    post:
      summary: Invite a clinician (screen 04)
      description: >-
        Creates an invited seat, provisions a Firebase user, and emails a
        set-password link (Auth·05). Response includes an `invite` object with
        `provisioned` / `emailSent` flags (best-effort; never rolls back).
      security:
        - firebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Clinician invited (+ invite dispatch result)
        "409":
          description: Already a member of this practice
        "422":
          description: No seats available
  /v1/practices/{id}/clinicians/{userId}/resend:
    post:
      summary: Resend a clinician's invite (screen 04)
      description: Regenerates the Firebase set-password link and re-sends the invite email.
      security:
        - firebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invite re-dispatched
        "404":
          description: Clinician not found in this practice
        "409":
          description: Clinician is already active
  /v1/practices/{id}/clinicians/import:
    post:
      summary: Bulk invite clinicians via CSV import (screen 04)
      security:
        - firebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Import processed (per-row invited/skipped)
  /v1/practices/{id}/activate:
    post:
      summary: Finish setup / go live (screen 05)
      security:
        - firebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Practice live; returns onboarding summary
components:
  securitySchemes:
    firebaseToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Authentication ID token.

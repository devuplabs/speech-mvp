openapi: 3.1.0
info:
  title: Sona API
  version: 0.1.0
  description: Intake, clinician workflows, and A2UI agent surface (uk/dev).
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: OK
  /ready:
    get:
      summary: Readiness (includes inference when configured)
      responses:
        "200":
          description: OK
  /v1/meta:
    get:
      summary: Service metadata
      responses:
        "200":
          description: OK

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-label="Sona wordmark">
  <!-- Brand mark: solid teal rounded square + white "S" monogram (matches apps/sona clinician_shell) -->
  <rect x="22" y="32" width="56" height="56" rx="14" fill="#2D6A6E"/>
  <text x="50" y="60" text-anchor="middle" dominant-baseline="central" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="38" fill="#FFFFFF">S</text>
  <!-- Wordmark -->
  <text x="100" y="78" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="60" fill="#142433" letter-spacing="-1">Sona</text>
</svg>

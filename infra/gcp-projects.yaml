# Canonical GCP project mapping (safe to commit — not secrets).
# Update this file when stage / prod projects are created, then add matching Cloud Build triggers.
#
# Console name vs project_id: Google often shows a friendly name (e.g. SONA-MVP-DEV) while
# project_id is the stable identifier used by Terraform and gcloud.

environments:
  dev:
    display_name: SONA-MVP-DEV
    project_id: project-a625d19b-de99-48e9-9a9
    project_number: "1055416779632"
    region: europe-west2
    terraform:
      root_dir: infra/terraform/environments/dev
      state_bucket: project-a625d19b-de99-48e9-9a9-terraform-state
      state_prefix: sona/core
    cloud_build:
      # Default Cloud Build service account (used until a dedicated terraform SA is wired in YAML)
      service_account: "1055416779632@cloudbuild.gserviceaccount.com"

  # Create GCP projects when ready, then fill in project_id / project_number / state_bucket.
  stage:
    display_name: SONA-MVP-STAGE
    project_id: REPLACE_WHEN_CREATED
    project_number: REPLACE_WHEN_CREATED
    region: europe-west2
    terraform:
      root_dir: infra/terraform/environments/stage
      state_bucket: REPLACE_WHEN_CREATED-terraform-state
      state_prefix: sona/core
    cloud_build:
      service_account: REPLACE_WHEN_CREATED@cloudbuild.gserviceaccount.com

  prod:
    display_name: SONA-MVP-PROD
    project_id: REPLACE_WHEN_CREATED
    project_number: REPLACE_WHEN_CREATED
    region: europe-west2
    terraform:
      root_dir: infra/terraform/environments/prod
      state_bucket: REPLACE_WHEN_CREATED-terraform-state
      state_prefix: sona/core
    cloud_build:
      service_account: REPLACE_WHEN_CREATED@cloudbuild.gserviceaccount.com

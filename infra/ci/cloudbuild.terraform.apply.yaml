# Terraform plan + apply — use only on a trigger with Cloud Build APPROVALS enabled.
# GitHub: typically push to main (after PR merge). Do not run apply on every PR.
#
# In Cloud Console: edit trigger → enable "Require approval before build executes"
# (or use a manual / release trigger). See infra/ci/cloud-build-terraform.md

substitutions:
  _TERRAFORM_DIR: infra/terraform/environments/uk/dev
  _STATE_BUCKET: project-a625d19b-de99-48e9-9a9-terraform-state
  _STATE_PREFIX: sona/uk/dev
  _TARGET_PROJECT_ID: project-a625d19b-de99-48e9-9a9
  _REGION: europe-west2
  _JURISDICTION: uk
  _ENVIRONMENT: dev
  _GCS_BUCKET_FORCE_DESTROY: "true"
  _DB_TIER: db-f1-micro
  _INFERENCE_ENABLED: "true"
  _MODEL_GCS_PREFIX: gemma-3-27b-it
  _VLLM_CONTAINER_IMAGE: europe-west2-docker.pkg.dev/project-a625d19b-de99-48e9-9a9/sona-sona/vllm-openai:latest
  _INFERENCE_ZONE: europe-west2-b

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE

# Uncomment after creating sona-terraform-cloudbuild@... and granting Cloud Build permission to use it:
# serviceAccount: projects/project-a625d19b-de99-48e9-9a9/serviceAccounts/sona-terraform-cloudbuild@project-a625d19b-de99-48e9-9a9.iam.gserviceaccount.com

timeout: 5400s

steps:
  - id: terraform-apply
    name: hashicorp/terraform:1.9.8
    dir: /workspace/${_TERRAFORM_DIR}
    entrypoint: sh
    args:
      - -c
      - |
        set -euo pipefail
        printf '%s\n' "bucket = \"${_STATE_BUCKET}\"" "prefix = \"${_STATE_PREFIX}\"" > backend.ci.hcl
        {
          echo "project_id = \"${_TARGET_PROJECT_ID}\""
          echo "region = \"${_REGION}\""
          echo "jurisdiction = \"${_JURISDICTION}\""
          echo "environment = \"${_ENVIRONMENT}\""
          echo "gcs_bucket_force_destroy = ${_GCS_BUCKET_FORCE_DESTROY}"
          echo "db_tier = \"${_DB_TIER}\""
          echo "inference_enabled = ${_INFERENCE_ENABLED}"
          echo "model_gcs_prefix = \"${_MODEL_GCS_PREFIX}\""
          echo "vllm_container_image = \"${_VLLM_CONTAINER_IMAGE}\""
          echo "inference_zone = \"${_INFERENCE_ZONE}\""
        } > ci.auto.tfvars
        terraform init -input=false -backend-config=backend.ci.hcl
        terraform validate
        terraform plan -input=false -out=tfplan
        terraform apply -input=false -auto-approve tfplan

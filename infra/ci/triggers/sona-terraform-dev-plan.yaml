# Cloud Build trigger (2nd gen GitHub). Substitute placeholders via setup-cloud-build.ps1 / .sh
# See infra/ci/triggers/README.md

name: sona-terraform-dev-plan
description: Terraform plan for uk/dev (PRs to main)
filename: infra/ci/cloudbuild.terraform.plan.yaml
includeBuildLogs: INCLUDE_BUILD_LOGS_WITH_STATUS
serviceAccount: REPLACE_CLOUD_BUILD_SA

repositoryEventConfig:
  repository: REPLACE_REPOSITORY_RESOURCE
  pullRequest:
    branch: ^main$
    commentControl: COMMENTS_ENABLED

substitutions:
  _TERRAFORM_DIR: infra/terraform/environments/uk/dev
  _STATE_BUCKET: REPLACE_PROJECT_ID-terraform-state
  _STATE_PREFIX: sona/uk/dev
  _TARGET_PROJECT_ID: REPLACE_PROJECT_ID
  _REGION: europe-west2
  _JURISDICTION: uk
  _ENVIRONMENT: dev
  _GCS_BUCKET_FORCE_DESTROY: "true"
  _DB_TIER: db-f1-micro
  _INFERENCE_ENABLED: "false"
  _MODEL_GCS_PREFIX: gemma-3-27b-it
  _VLLM_CONTAINER_IMAGE: europe-west2-docker.pkg.dev/REPLACE_PROJECT_ID/sona-sona/vllm-openai:latest
  _INFERENCE_ZONE: europe-west2-b

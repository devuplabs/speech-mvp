# Cloud Build trigger (2nd gen GitHub). Import after linking the repo:
#   gcloud builds triggers create --trigger-config=infra/ci/triggers/sona-terraform-dev-plan.yaml --region=europe-west2
#
# Set repository to your linked resource, e.g.:
#   projects/project-a625d19b-de99-48e9-9a9/locations/europe-west2/connections/sona-github/repositories/speech-mvp

name: sona-terraform-dev-plan
description: Terraform plan for uk/dev (PRs to main)
filename: infra/ci/cloudbuild.terraform.plan.yaml
includeBuildLogs: INCLUDE_BUILD_LOGS_WITH_STATUS

repositoryEventConfig:
  repository: REPLACE_REPOSITORY_RESOURCE
  pullRequest:
    branch: ^main$
    commentControl: COMMENTS_ENABLED

substitutions:
  _TERRAFORM_DIR: infra/terraform/environments/uk/dev
  _STATE_BUCKET: project-a625d19b-de99-48e9-9a9-terraform-state
  _STATE_PREFIX: sona/uk/dev
  _TARGET_PROJECT_ID: project-a625d19b-de99-48e9-9a9
  _REGION: europe-west2
  _JURISDICTION: uk
  _ENVIRONMENT: dev
  _GCS_BUCKET_FORCE_DESTROY: "true"
  _DB_TIER: db-f1-micro
  _INFERENCE_ENABLED: "true"
  _MODEL_GCS_PREFIX: gemma-3-27b-it
  _VLLM_CONTAINER_IMAGE: europe-west2-docker.pkg.dev/project-a625d19b-de99-48e9-9a9/sona-sona/vllm-openai:latest
  _INFERENCE_ZONE: europe-west2-b

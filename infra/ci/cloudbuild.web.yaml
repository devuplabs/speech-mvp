# Build Sona Flutter web and deploy to Cloud Run (static nginx).
# Do not run gcloud builds submit locally — use trigger sona-web-dev-deploy (merge to main).

substitutions:
  _REGION: europe-west2
  _AR_HOST: europe-west2-docker.pkg.dev
  _PROJECT_ID: project-a625d19b-de99-48e9-9a9
  _REPOSITORY: sona-sona
  _IMAGE: sona-web
  _WEB_SERVICE: sona-web-dev
  _API_URL: https://sona-api-dev-3rhenudy6a-nw.a.run.app

options:
  logging: CLOUD_LOGGING_ONLY

serviceAccount: projects/project-a625d19b-de99-48e9-9a9/serviceAccounts/sona-cloudbuild@project-a625d19b-de99-48e9-9a9.iam.gserviceaccount.com

# Firebase Web client config — provisioned in Secret Manager by Terraform
# (infra/terraform/modules/firebase_auth). The values are public client
# config that ships in the browser bundle; we route them through Secret
# Manager so they live in one place and rotate cleanly, and so the
# Cloud Build SA reads them with explicit IAM rather than via a hardcoded
# substitution in this file. See ADR-006 / firebase_auth/README.md.
availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT_ID}/secrets/sona-firebase-web-api-key/versions/latest
      env: FIREBASE_API_KEY
    - versionName: projects/${_PROJECT_ID}/secrets/sona-firebase-web-app-id/versions/latest
      env: FIREBASE_APP_ID
    - versionName: projects/${_PROJECT_ID}/secrets/sona-firebase-project-id/versions/latest
      env: FIREBASE_PROJECT_ID
    - versionName: projects/${_PROJECT_ID}/secrets/sona-firebase-auth-domain/versions/latest
      env: FIREBASE_AUTH_DOMAIN
    - versionName: projects/${_PROJECT_ID}/secrets/sona-firebase-messaging-sender-id/versions/latest
      env: FIREBASE_MESSAGING_SENDER_ID

timeout: 1800s

steps:
  - id: flutter-build
    name: ghcr.io/cirruslabs/flutter:stable
    dir: apps/sona
    entrypoint: bash
    secretEnv:
      - FIREBASE_API_KEY
      - FIREBASE_APP_ID
      - FIREBASE_PROJECT_ID
      - FIREBASE_AUTH_DOMAIN
      - FIREBASE_MESSAGING_SENDER_ID
    args:
      - -c
      - |
        flutter pub get
        flutter build web --release \
          --dart-define=SONA_API_BASE_URL=${_API_URL} \
          --dart-define=FIREBASE_API_KEY="$$FIREBASE_API_KEY" \
          --dart-define=FIREBASE_APP_ID="$$FIREBASE_APP_ID" \
          --dart-define=FIREBASE_PROJECT_ID="$$FIREBASE_PROJECT_ID" \
          --dart-define=FIREBASE_AUTH_DOMAIN="$$FIREBASE_AUTH_DOMAIN" \
          --dart-define=FIREBASE_MESSAGING_SENDER_ID="$$FIREBASE_MESSAGING_SENDER_ID"

  - id: docker-build
    name: gcr.io/cloud-builders/docker
    dir: apps/sona
    args:
      - build
      - -f
      - deploy/Dockerfile
      - -t
      - ${_AR_HOST}/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - -t
      - ${_AR_HOST}/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest
      - .

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_AR_HOST}/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WEB_SERVICE}
      - --image=${_AR_HOST}/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --project=${_PROJECT_ID}
      - --allow-unauthenticated
      - --port=8080
      - --quiet

  # API CORS_ORIGINS is managed by Terraform (cloud_run module → web.uri). Re-run terraform apply if the web URL changes.

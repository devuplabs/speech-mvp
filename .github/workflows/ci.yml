name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            e2e/package-lock.json
      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api
      - name: Lint API
        run: npm run lint
        working-directory: apps/api
      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e
      - name: Lint e2e
        run: npm run lint
        working-directory: e2e

  fhir-conformance:
    # ── Authoritative FHIR/UK Core conformance gate (DEV-27 / ADR-006) ─────────
    # Runs the OFFICIAL HL7 FHIR validator (org.hl7.fhir.validator / validator_cli)
    # against the committed golden Bundle, with the pinned UK Core R4 IG loaded.
    # This is the real compliance claim: resources that declare a UKCore profile
    # in `meta.profile` are validated against that profile; the base-R4 resources
    # (Task, EpisodeOfCare, general Observation, Communication — see ADR-006 §4)
    # are validated against base FHIR R4. The fast in-process validator in
    # `apps/api/src/fhir/validate.ts` is only a quick unit-test pre-check; THIS
    # job is the gate.
    #
    # Pinned for reproducibility:
    #   - validator_cli.jar     : 6.6.5 (HL7 hapifhir/org.hl7.fhir.core release)
    #   - FHIR core             : -version 4.0.1
    #   - UK Core IG package id  : fhir.r4.ukcore.stu2#2.0.2  (STU2, per ADR-006;
    #     this is the canonical FHIR package id that resolves the
    #     https://fhir.hl7.org.uk/StructureDefinition/UKCore-* canonicals pinned
    #     in apps/api/src/fhir/codes.ts).
    #
    # Gate: the build FAILS on any validator issue of severity `error` or `fatal`
    # (errors must be 0). `warning`/`information` issues are allowed but surfaced
    # in the step log and the uploaded OperationOutcome artifact.
    name: FHIR UK Core conformance (official HL7 validator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATOR_VERSION: "6.6.5"
      UKCORE_IG: "fhir.r4.ukcore.stu2#2.0.2"
      FHIR_VERSION: "4.0.1"
      GOLDEN_BUNDLE: apps/api/src/fhir/__fixtures__/golden-bundle.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Regenerate the golden Bundle from the deterministic golden case and fail
      # if it drifts from what is committed — so the validated artifact is always
      # exactly the mapper's current output (no stale fixture passing the gate).
      - name: Install API deps
        run: npm ci
        working-directory: apps/api
      - name: Verify golden Bundle is up to date
        run: |
          npx tsx scripts/gen-golden-bundle.mts
          if ! git diff --quiet -- src/fhir/__fixtures__/golden-bundle.json; then
            echo "::error::golden-bundle.json is stale. Run 'npx tsx scripts/gen-golden-bundle.mts' in apps/api and commit."
            git --no-pager diff -- src/fhir/__fixtures__/golden-bundle.json
            exit 1
          fi
        working-directory: apps/api

      # Cache the validator jar and the resolved FHIR package cache (core + UK
      # Core IG) so repeat runs don't re-download ~160MB jar + packages.
      - name: Cache validator jar
        id: cache-validator
        uses: actions/cache@v4
        with:
          path: ~/validator_cli.jar
          key: fhir-validator-${{ env.VALIDATOR_VERSION }}
      - name: Download official HL7 validator
        if: steps.cache-validator.outputs.cache-hit != 'true'
        run: |
          curl -fL -o ~/validator_cli.jar \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
      - name: Cache FHIR package cache (core + UK Core IG)
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-pkgcache-${{ env.FHIR_VERSION }}-${{ env.UKCORE_IG }}-${{ env.VALIDATOR_VERSION }}

      - name: Validate golden Bundle against UK Core R4
        run: |
          set -o pipefail
          echo "Validating $GOLDEN_BUNDLE"
          echo "  validator   = $VALIDATOR_VERSION"
          echo "  FHIR core   = $FHIR_VERSION"
          echo "  UK Core IG  = $UKCORE_IG"
          # -ig loads the pinned UK Core package (pulls core 4.0.1 + the IG into
          #    ~/.fhir/packages). Resources are validated against the profiles in
          #    their meta.profile; base-R4 resources against base R4.
          # -output writes a machine-readable OperationOutcome we gate on.
          java -jar ~/validator_cli.jar "$GOLDEN_BUNDLE" \
            -version "$FHIR_VERSION" \
            -ig "$UKCORE_IG" \
            -output /tmp/fhir-validation-outcome.json \
            | tee /tmp/fhir-validation.log
        # Note: do not rely on the CLI exit code alone — we gate explicitly on the
        # OperationOutcome severities below so the rule (errors=0) is unambiguous.
        continue-on-error: true

      - name: Gate on zero errors (errors=0)
        run: |
          OUT=/tmp/fhir-validation-outcome.json
          if [ ! -f "$OUT" ]; then
            echo "::error::validator produced no OperationOutcome — see log above"
            exit 1
          fi
          ERRORS=$(node -e "const o=require('$OUT');const i=(o.issue||[]).filter(x=>x.severity==='error'||x.severity==='fatal');console.log(i.length);for(const x of i)console.error('ERROR',(x.location||x.expression||['?']).join(','),x.diagnostics||(x.details&&x.details.text))")
          WARN=$(node -e "const o=require('$OUT');console.log((o.issue||[]).filter(x=>x.severity==='warning').length)")
          INFO=$(node -e "const o=require('$OUT');console.log((o.issue||[]).filter(x=>x.severity==='information').length)")
          echo "Validator issues — errors=$ERRORS warnings=$WARN information=$INFO"
          if [ "$ERRORS" != "0" ]; then
            echo "::error::FHIR UK Core conformance failed: $ERRORS error(s). errors must be 0."
            exit 1
          fi
          echo "FHIR UK Core conformance OK (errors=0; warnings/information are tolerated)."
      - name: Upload validation OperationOutcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fhir-validation-outcome
          path: |
            /tmp/fhir-validation-outcome.json
            /tmp/fhir-validation.log
          if-no-files-found: ignore

  npm-audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Fail the build on high/critical advisories in *runtime* dependencies
      # (--omit=dev). These are what ship to Cloud Run, so they are the gate
      # that matters. Dev-toolchain advisories (test runner / bundler) do not
      # reach production and are surfaced/updated by Dependabot instead, so we
      # keep them out of the blocking gate to avoid churny red builds on
      # major-version test-tooling bumps. Run per workspace so a finding clearly
      # points at the affected lockfile. DEV-31.
      - name: Audit apps/api (runtime deps)
        run: npm audit --omit=dev --audit-level=high
        working-directory: apps/api
      - name: Audit e2e (runtime deps)
        run: npm audit --omit=dev --audit-level=high
        working-directory: e2e

  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/sona
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      # Info-level lint hints are expected; only warnings+ fail the build.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  e2e-smoke:
    name: E2E smoke (API + web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sona_app
          POSTGRES_PASSWORD: sona_dev_pass
          POSTGRES_DB: sona
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sona_app:sona_dev_pass@127.0.0.1:5432/sona
      SONA_API_URL: http://localhost:8081
      SONA_WEB_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            e2e/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api

      # DEV-25: run the DB-backed API integration suite against the Postgres
      # service. The unit `api` job above runs without a DB, so these audit-log
      # append-only / DSAR-scrub / retention tests only execute here.
      - name: API DB integration tests
        run: npm test
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://sona_app:sona_dev_pass@127.0.0.1:5432/sona
      - name: Install e2e dependencies
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Build Flutter web
        run: |
          flutter pub get
          flutter build web --release --dart-define=SONA_API_BASE_URL=http://localhost:8081
        working-directory: apps/sona

      - name: Start API
        run: |
          # Raise the token rate limit well above what the smoke suite issues so
          # the limiter stays wired (real middleware path) without false 429s
          # from many specs sharing one CI IP. The 429 behaviour itself is
          # covered deterministically by the rate-limit unit test (DEV-31).
          export PORT=8081 NODE_ENV=development CORS_ALLOW_LOCALHOST=true RUN_MIGRATIONS_ON_START=true
          export RATE_LIMIT_TOKEN_MAX=1000
          nohup npx tsx src/index.ts > /tmp/sona-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8081/health && break
            sleep 2
          done
          curl -fsS http://localhost:8081/health
        working-directory: apps/api

      - name: Serve Flutter web
        run: |
          nohup python3 -m http.server 8080 --directory apps/sona/build/web > /tmp/sona-web.log 2>&1 &
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080 > /dev/null && break
            sleep 2
          done

      # parent-intake-full.spec.ts (full browser intake-through-submit flow) is
      # now stable headless and included here: its date-picker flake was fixed in
      # DEV-36 (SonaDateField is keyboard-editable, taps are retried until they
      # take effect). Proven with 10/10 consecutive local headless runs.
      - name: Run Playwright smoke + API specs
        run: |
          npx playwright test \
            tests/parent-intake-smoke.spec.ts \
            tests/parent-intake-full.spec.ts \
            tests/api-bootstrap.spec.ts \
            tests/intake-api-full.spec.ts \
            tests/questionnaire-api.spec.ts \
            tests/clinical-report-api.spec.ts \
            tests/register-patient-api.spec.ts \
            tests/booking-api.spec.ts \
            tests/carryover-api.spec.ts \
            tests/parent-summary-delivery-api.spec.ts \
            tests/tenant-isolation.spec.ts \
            tests/magic-link-negative-api.spec.ts \
            tests/state-machine-negative-api.spec.ts \
            tests/full-journey-api.spec.ts \
            tests/dsar-erasure-api.spec.ts \
            tests/audit-log-api.spec.ts \
            tests/fhir-export-api.spec.ts \
            tests/personas-parity.spec.ts
        working-directory: e2e

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: service-logs
          path: /tmp/sona-*.log
          if-no-files-found: ignore
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

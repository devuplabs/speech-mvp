# Dependabot config — DEV-31 (security hardening: dependency audit).
# Version updates only. GitHub secret scanning / push protection and Dependabot
# *security alerts* are repo-admin toggles (see docs/security/hardening-checklist.md).
version: 2
updates:
  # API service (Node / npm)
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - api

  # End-to-end test harness (Node / npm)
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - e2e

  # Flutter app (Dart / pub)
  - package-ecosystem: pub
    directory: /apps/sona
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - flutter

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
